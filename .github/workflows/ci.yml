name: CI
# Box offload (Grant, Oct 11 2026): all heavy test runs live here, not on the shared box.
# Public repo: Actions minutes are free.
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: lts/*, cache: npm }
      - run: npm ci
      - id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - run: npx playwright install --with-deps webkit
      - name: Playwright (all projects; Chrome = runner's /usr/bin/google-chrome)
        run: npx playwright test --workers=2 --reporter=list --trace=retain-on-failure
        env:
          CHROME_PATH: /usr/bin/google-chrome
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7
